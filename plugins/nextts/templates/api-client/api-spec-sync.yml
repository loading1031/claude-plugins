# 서버 API 스펙(openapi/openapi.json)이 개발 브랜치에 머지되면 프론트 타입을 다시 만들어 PR을 연다 (nextts 플러그인)
# 필요: 저장소 Variables APP_CLIENT_ID, Secrets APP_PRIVATE_KEY (GitHub App, 권한 Contents·Pull requests 쓰기)
name: API 스펙 동기화

on:
  push:
    branches: [__DEV_BRANCH__]
    paths: [openapi/openapi.json]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: __FRONT_DIR__/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "__NODE_VERSION__"
          cache: pnpm
          cache-dependency-path: __FRONT_DIR__/pnpm-lock.yaml
      - name: 타입 다시 만들기
        working-directory: __FRONT_DIR__
        run: |
          pnpm install --frozen-lockfile
          pnpm api:generate
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      # 바뀐 것이 없으면 PR을 만들지 않는다. 같은 브랜치의 PR이 열려 있으면 갱신한다
      - uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: __DEV_BRANCH__
          branch: chore/api-spec-sync
          delete-branch: true
          add-paths: __FRONT_DIR__/server/api/schema.d.ts
          commit-message: "chore: API 스펙 갱신"
          title: "chore: API 스펙 갱신"
          body: |
            `openapi/openapi.json` 변경(${{ github.sha }})에 맞춰 `server/api/schema.d.ts`를 다시 만들었다.
            타입 검사가 실패하면 이 PR에서 화면 코드를 고친다.
